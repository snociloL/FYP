<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .header {
      background: #16213e;
      padding: 12px 16px;
      border-bottom: 1px solid #0f3460;
    }
    .header h3 { font-size: 14px; font-weight: 600; color: #fff; }
    .header p  { font-size: 11px; color: #666; margin-top: 2px; }

    .content { padding: 12px 16px; }

    .status {
      background: #0f3460;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #a0c4ff;
      min-height: 34px;
      display: flex;
      align-items: center;
    }

    .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
      margin-bottom: 6px;
    }

    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-tab     { background: #0f3460; color: #a0c4ff; }
    .btn-stop    { background: #3d0000; color: #ff8080; }

    hr { border: none; border-top: 1px solid #0f3460; margin: 12px 0; }

    .upload-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px;
      border: 1px dashed #0f3460;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #666;
    }
    .upload-label:hover { border-color: #a0c4ff; color: #a0c4ff; }
    #videoInput { display: none; }

    .progress {
      font-size: 11px;
      color: #555;
      margin-top: 8px;
      text-align: center;
    }

    .result {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
    .result.fake      { background: #3d0000; color: #ff6b6b; display: block; }
    .result.real      { background: #003d00; color: #6bff6b; display: block; }
    .result.uncertain { background: #2a2a00; color: #ffd76b; display: block; }
    .result .conf     { font-size: 11px; font-weight: 400; margin-top: 3px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="header">
    <h3>Deepfake Validator</h3>
    <p>ResNet-50 + LSTM</p>
  </div>
  <div class="content">
    <div class="status" id="statusEl">Initializing...</div>

    <div class="label">Live Tab Analysis</div>
    <button class="btn btn-tab" id="captureBtn">Analyze Current Tab</button>

    <hr>

    <div class="label">Upload Video File</div>
    <label class="upload-label" for="videoInput">
      &#128190; Choose video (.mp4 / .webm / .mov)
    </label>
    <input type="file" id="videoInput" accept="video/*">

    <div class="progress" id="progressEl"></div>
    <div class="result"   id="resultEl">
      <div id="resultText"></div>
      <div class="conf" id="confText"></div>
    </div>
  </div>
  <iframe id="sandboxFrame" src="sandbox.html" style="display:none"></iframe>
  <script src="popup.js"></script>
</body>
</html>
